name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build

      - name: Verify compiled Vite dist output
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html || { echo "ERROR: dist/index.html missing"; exit 1; }
          echo "=== dist/index.html ==="
          cat dist/index.html
          echo "=== dist files ==="
          find dist -type f | sort

          if grep -E '(/src/|\.tsx)' dist/index.html; then
            echo "ERROR: dist/index.html still references /src/ or .tsx!"
            exit 1
          fi

          js_refs=$(grep -oE '/advanced-computer-networks-guide/assets/[^"'\'' ]+\.js' dist/index.html || true)
          css_refs=$(grep -oE '/advanced-computer-networks-guide/assets/[^"'\'' ]+\.css' dist/index.html || true)

          if [ -z "$js_refs" ]; then
            echo "ERROR: No compiled JS asset under /advanced-computer-networks-guide/assets/ referenced in dist/index.html!"
            exit 1
          fi
          if [ -z "$css_refs" ]; then
            echo "ERROR: No compiled CSS asset under /advanced-computer-networks-guide/assets/ referenced in dist/index.html!"
            exit 1
          fi

          for ref in $js_refs $css_refs; do
            rel="${ref#/advanced-computer-networks-guide/}"
            if [ ! -s "dist/$rel" ]; then
              echo "ERROR: Referenced asset dist/$rel is missing or empty!"
              exit 1
            fi
            echo "Verified asset: dist/$rel ($(wc -c < "dist/$rel") bytes)"
          done

          bad_files=$(find dist -type f \( -iname '*.pdf' -o -iname '*.zip' -o -iname '*.tar' -o -iname '*.gz' \) || true)
          if [ -n "$bad_files" ]; then
            echo "ERROR: Forbidden PDF or archive files found in dist/:"
            echo "$bad_files"
            exit 1
          fi

          touch dist/.nojekyll
          echo "PASS: dist/ verified as compiled Vite output with no PDFs or archives."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
